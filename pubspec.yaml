name: optima
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  file_picker: ^10.1.2
  url_launcher: ^6.2.5
  fl_chart: ^0.66.2
  font_awesome_flutter: ^10.5.0
  dio: ^5.3.3
  media_store_plus: ^0.1.3
  permission_handler: ^11.3.1
  path_provider: ^2.1.1
  universal_html: ^2.2.4
  web: 1.1.1
  js: ^0.6.3 
  flutter_local_notifications: ^19.1.0
  firebase_messaging: 15.2.5
  google_maps_flutter: ^2.5.0
  geolocator: ^10.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/truck_icon.png
    - assets/icon/warehouse_icon.png
    - assets/icon/material_icon.png
    - assets/map_style_light.json
    - assets/map_style_dark.json

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
